name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # `label` names the files people download: DBunny-<version>-<label>.<ext>
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-Apple-Silicon
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-Intel
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the app checks them against plugins.updater.pubkey.
          # With these, the release also gets latest.json, which installed apps read to update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DBunny ${{ github.ref_name }}
          releaseBody: |
            ## Which file do I need?

            | Your system | Download |
            |---|---|
            | macOS on Apple Silicon (M1 and later) | `DBunny-<version>-macOS-Apple-Silicon.dmg` |
            | macOS on Intel | `DBunny-<version>-macOS-Intel.dmg` |
            | Windows | `DBunny-<version>-Windows-x64-setup.exe` (or the `.msi`) |
            | Linux, any distribution | `DBunny-<version>-Linux-x64.AppImage` |
            | Debian, Ubuntu | `DBunny-<version>-Linux-x64.deb` |
            | Fedora, openSUSE | `DBunny-<version>-Linux-x64.rpm` |
          releaseDraft: true
          prerelease: false
          # e.g. DBunny-0.3.0-macOS-Apple-Silicon.dmg, DBunny-0.3.0-Windows-x64-setup.exe
          assetNamePattern: DBunny-[version]-${{ matrix.label }}[setup][ext]
          args: --target ${{ matrix.target }}
