[package]
name = "dbunny"
version = "0.11.0"
edition = "2021"

[lib]
name = "dbunny_lib"
crate-type = ["lib", "cdylib", "staticlib"]

# The executable carries the app's name, so it reads "DBunny" in dev too (menu bar, Dock, task manager)
[[bin]]
name = "DBunny"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "=2.4.1"
tauri-plugin-process = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "=0.1.89"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1", "array-impls"] }
bytes = "1"
futures-util = "0.3"
russh = { version = "=0.63.3", default-features = false, features = ["ring", "flate2", "rsa"] }
native-tls = "0.2"
postgres-native-tls = "0.5"
rust_decimal = { version = "1", features = ["tokio-pg"] }
tokio = { version = "1", features = ["full"] }
deadpool-postgres = "0.14"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
hostname = "0.4"
rusqlite = { version = "=0.40.2", features = ["bundled", "column_decltype"] }
# rustls, not native-tls: with native-tls a client certificate must be PKCS#12, and the SSL tab takes PEM files
# The assistant's local MCP server: rmcp does the protocol, hyper takes the connections
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
hyper = { version = "=1.8.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["server", "http1", "tokio", "service"] }
http-body-util = "=0.1.3"
http = "=1.4.0"
tokio-util = "=0.7.18"
mysql_async = { version = "=0.37.1", default-features = false, features = ["default-rustls-ring", "client_ed25519"] }

[target.'cfg(unix)'.dependencies]
# Ends the agent's whole process group, not only the command that started it
libc = "=0.2.190"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# Without the "zip" feature: it only reads the old zipped update bundles, and the
# new ones (createUpdaterArtifacts: true) aren't zipped
tauri-plugin-updater = { version = "=2.13.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
